services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
      POSTGRES_DB: ads
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  mlflow:
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://ads:ads@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    volumes: [mlartifacts:/mlartifacts]
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["5000:5000"]

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://ads:ads@postgres:5432/ads
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR: /srv/data
    volumes: [appdata:/srv/data]
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_started }
    ports: ["8000:8000"]

volumes: { pgdata: {}, mlartifacts: {}, appdata: {} }
